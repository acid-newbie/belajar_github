
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: grey;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: rgb(15, 15, 15);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello World!</h1>
        <p>Promt HTML.</p>

        <button onclick="alert('Halo! Website berhasil dijalankan.')">
            Click Me!!
        </button>
    </div>

</body>
</html>
